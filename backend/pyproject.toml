[project]
name = "moneyprint-backend"
version = "0.1.0"
description = "Backend API for the MoneyPrint short-video automation platform"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "celery==5.4.0",
    "redis==5.2.1",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "tenacity==9.0.0",
    # IANA tz database for zoneinfo — needed on Windows, where the OS doesn't
    # ship one. Was already present transitively via celery/kombu; made
    # explicit because the YouTube search provider now depends on it directly
    # (quota resets at midnight Pacific Time) and transitive deps can be
    # dropped without notice.
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]
# Providers that need heavy/native deps live here so the core API can boot without them.
engine = [
    "ollama==0.4.5",
]
# Laboratório de vídeo (Etapa 3): scene detection, audio/whisper, imaging —
# only needed by engine/video_lab/, never imported at API boot. ffmpeg and
# tesseract remain system binaries, detected at runtime, not pip packages.
lab = [
    "scenedetect==0.6.5.2",
    "opencv-python-headless==4.10.0.84",
    "imageio-ffmpeg==0.6.0",
    "faster-whisper==1.1.0",
    "numpy==1.26.4",
    "pytesseract==0.3.13",
    # Reference-video deep-dive (Canais) and the Lab's link-fetch stub, both
    # off by default — downloading third-party media is the user's own
    # opt-in decision (MP_ENABLE_REFERENCE_MEDIA_DOWNLOAD / MP_ENABLE_LINK_FETCH).
    "yt-dlp==2026.8.19",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
